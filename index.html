<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocScheduler | Appointment Management System</title>
    <link rel="stylesheet" href="style.css?v=1.2">
</head>
<body>
    <div id="toast"></div>

    <div class="container">
        <header>
            <div>
                <h1>DocScheduler</h1>
                <p style="color: var(--text-dim); font-size: 0.875rem; margin-top: 0.25rem;">Modern Healthcare Management</p>
            </div>
            <div class="nav-links" id="nav-links">
                <!-- Dynamic based on auth -->
            </div>
        </header>

        <main id="main-content">
            <!-- Auth Screen -->
            <div id="auth-screen">
                <div class="auth-card" id="login-form">
                    <h2>Welcome Back</h2>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="login-email" placeholder="email@example.com">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="login-password" placeholder="••••••••">
                    </div>
                    <button class="btn-primary" onclick="handleLogin()">Sign In</button>
                    <p class="toggle-auth">Don't have an account? <span onclick="toggleAuth('register')">Register</span></p>
                </div>

                <div class="auth-card" id="register-form" style="display: none;">
                    <h2>Create Account</h2>
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="reg-name" placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="reg-email" placeholder="email@example.com">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="reg-password" placeholder="••••••••">
                    </div>
                    <div class="form-group">
                        <label>Role</label>
                        <select id="reg-role">
                            <option value="patient">Patient</option>
                            <option value="doctor">Doctor</option>
                        </select>
                    </div>
                    <button class="btn-primary" onclick="handleRegister()">Register</button>
                    <p class="toggle-auth">Already have an account? <span onclick="toggleAuth('login')">Login</span></p>
                </div>
            </div>

            <!-- Patient Dashboard (Initially Hidden) -->
            <div id="patient-dashboard" style="display: none;">
                <div id="reminder-box"></div>
                <div class="dashboard-grid">
                    <div>
                        <h2>Available Doctors</h2>
                        <div class="doctor-list" id="doctor-list">
                            <!-- Populated via JS -->
                        </div>
                    </div>
                    <div>
                        <h2>Your Appointments</h2>
                        <div class="history-list" id="appointment-history">
                            <!-- Populated via JS -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Admin Dashboard (Initially Hidden) -->
            <div id="admin-dashboard" style="display: none;">
                <div class="dashboard-grid">
                    <div>
                        <h2>Manage Doctors</h2>
                        <div class="auth-card" style="max-width: none; margin: 1rem 0; padding: 1.5rem;">
                            <h3>Add New Doctor</h3>
                            <div class="form-group">
                                <label>Doctor Name</label>
                                <input type="text" id="doc-name-inp">
                            </div>
                            <div class="form-group">
                                <label>Specialization</label>
                                <input type="text" id="doc-spec-inp">
                            </div>
                            <div class="form-group">
                                <label>Available Days (Comma separated)</label>
                                <input type="text" id="doc-days-inp" placeholder="Monday, Wednesday">
                            </div>
                            <button class="btn-primary" onclick="handleAddDoctor()">Add Doctor</button>
                        </div>
                        <div class="doctor-list" id="admin-doctor-list"></div>
                    </div>
                    <div>
                        <h2>All Appointments</h2>
                        <div class="history-list" id="admin-appointment-list"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Booking Modal (Simplified as alert/prompt or visible div) -->
    <div id="booking-modal" class="auth-card" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1001; width: 400px;">
        <h3>Book Appointment</h3>
        <p id="booking-doctor-name"></p>
        <div class="form-group">
            <label>Date</label>
            <input type="date" id="booking-date">
        </div>
        <div class="form-group">
            <label>Time Slot</label>
            <select id="booking-slot">
                <option value="10:00 AM">10:00 AM</option>
                <option value="10:30 AM">10:30 AM</option>
                <option value="11:00 AM">11:00 AM</option>
                <option value="11:30 AM">11:30 AM</option>
                <option value="12:00 PM">12:00 PM</option>
            </select>
        </div>
        <button class="btn-primary" onclick="confirmBooking()">Confirm</button>
        <button class="btn-primary" style="background: var(--text-dim); margin-top: 0.5rem;" onclick="closeBookingModal()">Cancel</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
